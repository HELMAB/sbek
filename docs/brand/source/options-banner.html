<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sbek — Theme Option banner (1200×240 @2x)</title>
<link rel="stylesheet" href="brand.css">
<style>
	.stage {
		width: 1200px;
		height: 240px;
		background:
			radial-gradient(ellipse 40% 120% at 88% 40%, rgba(250, 25, 57, .42), transparent 65%),
			radial-gradient(ellipse 30% 90% at 0% 120%, rgba(250, 25, 57, .18), transparent 60%),
			linear-gradient(160deg, #141417 0%, #0b0b0d 70%);
	}
	.stage::before { background-size: 32px 32px; mask-image: linear-gradient(90deg, #000 0%, transparent 70%); }

	.copy { position: absolute; top: 26px; left: 36px; width: 780px; }
	.top { display: flex; align-items: center; gap: 14px; }
	.mark { --s: 44px; }
	.word { font-size: 26px; }
	.word small { font-size: 9px; margin-top: 4px; }
	.ver {
		margin-left: 6px;
		padding: 4px 10px;
		border-radius: 999px;
		background: rgba(250, 25, 57, .16);
		border: 1px solid rgba(250, 25, 57, .45);
		font-size: 11px;
		font-weight: 700;
		color: #ffd6dc;
	}
	.copy h2 { margin-top: 18px; font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
	.copy h2 em { font-style: normal; color: #ff4d66; }
	.copy p.lead { margin-top: 6px; font-size: 14px; }

	.steps { position: absolute; top: 178px; left: 36px; display: flex; gap: 6px; }
	.step {
		display: flex;
		align-items: center;
		gap: 7px;
		padding: 5px 12px 5px 5px;
		border-radius: 999px;
		background: rgba(255, 255, 255, .05);
		border: 1px solid var(--line);
		font-size: 12px;
		font-weight: 700;
		color: #e6e6ea;
		white-space: nowrap;
	}
	.step i {
		display: grid;
		place-items: center;
		width: 22px;
		height: 22px;
		border-radius: 50%;
		background: var(--red);
		font-style: normal;
		font-size: 11px;
		font-weight: 800;
		color: #fff;
	}
		.step:first-child { background: rgba(250, 25, 57, .18); border-color: rgba(250, 25, 57, .5); }

	/* right-hand mockups */
	.devices { position: absolute; inset: 0; perspective: 1800px; }
	.tilt {
		position: absolute;
		inset: 0;
		transform-style: preserve-3d;
		transform: rotateX(18deg) rotateY(-18deg) rotateZ(8deg);
		transform-origin: 85% 50%;
	}
	.b1 { top: 30px; left: 940px; width: 420px; }
	.b1 img { height: 300px; }
	.ph { top: 52px; left: 900px; width: 112px; padding: 5px; border-radius: 20px; }
	.ph img { height: 230px; border-radius: 16px; }
	.ph::after { top: 10px; width: 34px; height: 9px; margin-left: -17px; }

	.swatch {
		position: absolute;
		top: 150px;
		left: 990px;
		display: flex;
		white-space: nowrap;
		align-items: center;
		gap: 10px;
		padding: 8px 12px 8px 8px;
		border-radius: 12px;
		background: #fff;
		color: #111;
		box-shadow: 0 14px 30px rgba(0, 0, 0, .5);
	}
	.swatch .dots { display: flex; }
	.swatch .dots b { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; margin-left: -6px; }
	.swatch .dots b:first-child { margin-left: 0; }
	.swatch strong { display: block; font-size: 12px; font-weight: 800; line-height: 1.1; }
	.swatch span { display: block; font-size: 10px; font-weight: 600; color: #6b6b73; }
	.swatch .aa { font-family: var(--khmer); font-size: 22px; line-height: 1; padding-top: 4px; color: var(--red); }
</style>
</head>
<body>
<div class="stage">

	<div class="devices">
		<div class="tilt">
			<div class="browser b1"><div class="bar"><i></i><i></i><i></i><em>sbek.news</em></div><img src="../captures/desktop-home.png" alt=""></div>
		</div>
		<div class="phone ph"><img src="../captures/mobile-home.png" alt=""></div>
	</div>

	<div class="swatch">
		<div class="dots"><b style="background:#fa1939"></b><b style="background:#161616"></b><b style="background:#000"></b></div>
		<div><strong>Your brand</strong><span>colors · 11 Khmer fonts</span></div>
	</div>

	<div class="copy">
		<div class="top">
			<div class="mark"><span>ស</span></div>
			<div class="word">Sbek<small>News Theme</small></div>
			<span class="ver">v2.0.0</span>
		</div>
		<h2>Set up your news site in <em>7 tabs</em>.</h2>
		<p class="lead">Identity, design, homepage blocks, contact details and tracking — Khmer and English, all in one place.</p>
	</div>

	<div class="steps">
		<span class="step"><i>1</i>General</span>
		<span class="step"><i>2</i>Design</span>
		<span class="step"><i>3</i>Homepage</span>
		<span class="step"><i>4</i>Contact &amp; Footer</span>
		<span class="step"><i>5</i>Social</span>
		<span class="step"><i>6</i>Integrations</span>
		<span class="step"><i>7</i>Tools &amp; demo</span>
	</div>

</div>
</body>
</html>
